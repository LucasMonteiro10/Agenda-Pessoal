services:
  postgres:
    image: postgres:16-alpine
    container_name: cronograma-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cronograma}
      POSTGRES_USER: ${POSTGRES_USER:-cronograma_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cronograma_user} -d ${POSTGRES_DB:-cronograma}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Interface web simples para inspecionar o banco durante o desenvolvimento.
  # Acesse em http://localhost:8081 (ou a porta definida em ADMINER_PORT).
  adminer:
    image: adminer:latest
    container_name: cronograma-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:

# Nota (Dia 1): apenas a infraestrutura de dados roda em container por enquanto.
# Os serviços de backend (Spring Boot) e frontend (Vue) entram aqui no Dia 2,
# quando o esqueleto dos projetos existir.
