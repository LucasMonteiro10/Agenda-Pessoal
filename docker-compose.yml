services:
  postgres:
    image: postgres:16-alpine
    container_name: agenda-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agenda}
      POSTGRES_USER: ${POSTGRES_USER:-agenda_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agenda_user} -d ${POSTGRES_DB:-agenda}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Interface web simples para inspecionar o banco durante o desenvolvimento.
  # Acesse em http://localhost:8081 (ou a porta definida em ADMINER_PORT).
  adminer:
    image: adminer:latest
    container_name: agenda-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    depends_on:
      - postgres

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: agenda-backend
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-agenda}
      POSTGRES_USER: ${POSTGRES_USER:-agenda_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      BACKEND_PORT: ${BACKEND_PORT:-3000}
      JWT_SECRET: ${JWT_SECRET:-changeme-em-producao}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "${BACKEND_PORT:-3000}:${BACKEND_PORT:-3000}"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: agenda-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:

# Nota (Dia 2): backend (NestJS) e frontend (React) agora também rodam em
# container, com hot-reload via bind mount do código-fonte. O volume anônimo
# em /app/node_modules evita que o node_modules do host (ou a ausência dele)
# sobrescreva o que foi instalado dentro da imagem.
